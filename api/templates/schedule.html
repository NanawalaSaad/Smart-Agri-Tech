<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Desert AgriTech - Crop Schedule</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
        body { background:linear-gradient(135deg,#d97706,#92400e); min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px; }
        .navbar { max-width:1100px; width:100%; margin-bottom:15px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
        .nav-link { padding:10px 18px; background:rgba(255,255,255,0.9); color:#92400e; text-decoration:none; border-radius:8px; font-weight:600; font-size:13px; transition:0.3s; }
        .nav-link:hover, .nav-link.active { background:#92400e; color:white; }
        .container { background:#fff; border-radius:16px; padding:40px; max-width:1000px; width:100%; box-shadow:0 10px 40px rgba(0,0,0,0.2); }
        h1 { color:#92400e; text-align:center; margin-bottom:5px; }
        .subtitle { text-align:center; color:#666; margin-bottom:30px; }
        .input-section { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:25px; }
        .field { display:flex; flex-direction:column; gap:8px; }
        .field label { font-weight:600; color:#444; }
        .field input { padding:12px; border:2px solid #e5e7eb; border-radius:8px; font-size:15px; outline:none; }
        .field input:focus { border-color:#d97706; }
        button { width:100%; padding:15px; background:#d97706; color:white; border:none; border-radius:8px; font-size:17px; font-weight:bold; cursor:pointer; transition:0.3s; }
        button:hover { background:#92400e; }
        .result { margin-top:25px; display:none; }
        .crop-card { background:#fef3c7; border-radius:12px; padding:20px; margin-bottom:15px; }
        .crop-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
        .crop-name { font-size:18px; font-weight:700; color:#92400e; }
        .match-badge { background:#92400e; color:white; padding:4px 12px; border-radius:20px; font-size:13px; }
        .progress-section { margin-bottom:10px; }
        .progress-label { display:flex; justify-content:space-between; font-size:13px; color:#666; margin-bottom:4px; }
        .progress-bar { background:#e5e7eb; border-radius:4px; overflow:hidden; height:18px; }
        .progress-fill { background:linear-gradient(90deg,#d97706,#92400e); height:100%; border-radius:4px; transition:width 0.5s; }
        .details-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:12px; }
        .detail-box { background:white; border-radius:8px; padding:10px; text-align:center; }
        .detail-box .val { font-size:18px; font-weight:700; color:#d97706; }
        .detail-box .lbl { font-size:11px; color:#888; margin-top:2px; }
        .alert { padding:15px; border-radius:8px; margin-top:15px; font-weight:600; }
        .alert-good { background:#d1fae5; color:#065f46; }
        .alert-warn { background:#fef3c7; color:#92400e; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/" class="nav-link">🏠 Predictor</a>
        <a href="/predict-options" class="nav-link">🎯 Smart Predict</a>
        <a href="/insights" class="nav-link">📊 Insights</a>
        <a href="/crop" class="nav-link">🌱 Crop Recommend</a>
        <a href="/schedule" class="nav-link active">📅 Schedule</a>
        <a href="/hardware" class="nav-link">🔧 Hardware</a>
        <a href="/protection" class="nav-link">🛡️ Desert Shield</a>
        <a href="/playbook" class="nav-link">📖 AI Playbook</a>
        <a href="/contact" class="nav-link">🌿 Join the Oasis</a>
        <a href="/about" class="nav-link">ℹ️ About</a>
    </div>

    <div class="container">
        <h1>📅 Crop Growth Schedule</h1>
        <p class="subtitle">Apni conditions aur din daalo — AI best crop ka schedule batayega</p>

        <div class="input-section">
            <div class="field">
                <label>🌡️ Temperature (°C)</label>
                <input type="number" id="temperature" value="42" min="35" max="55">
            </div>
            <div class="field">
                <label>💧 Humidity (%)</label>
                <input type="number" id="humidity" value="25" min="10" max="40">
            </div>
            <div class="field">
                <label>🌱 Soil Moisture (%)</label><input type="number" id="soil_moisture" value="60" min="20" max="80">
            </div>
            <div class="field">
                <label>⚗️ pH Level</label>
                <input type="number" id="pH_level" value="6.5" min="5.5" max="7.5" step="0.1">
            </div>
            <div class="field">
                <label>☀️ Light Hours</label>
                <input type="number" id="light_hours" value="12" min="6" max="14">
            </div>
            <div class="field">
                <label>🚿 Water Given (ml)</label>
                <input type="number" id="water_given_ml" value="300" min="100" max="500">
            </div>
            <div class="field">
                <label>🧪 Nutrient Level (%)</label>
                <input type="number" id="nutrient_level" value="80" min="0" max="100">
            </div>
            <div class="field">
                <label>📆 Days Already Grown (0 = new)</label>
                <input type="number" id="days_grown" value="0" min="0" max="365">
            </div>
        </div>

        <button onclick="getSchedule()">📅 Get Crop Schedule</button>

        <div class="result" id="resultSection">
            <h2 style="color:#92400e; margin:20px 0 15px; text-align:center;">🏆 Top 3 Crops With Schedule</h2>
            <div id="scheduleList"></div>
        </div>
    </div>

    <script>
        function getSchedule() {
            var days = parseInt(document.getElementById('days_grown').value) || 0;
            var data = {
                temperature: parseFloat(document.getElementById('temperature').value),
                humidity: parseFloat(document.getElementById('humidity').value),
                soil_moisture: parseFloat(document.getElementById('soil_moisture').value),
                pH_level: parseFloat(document.getElementById('pH_level').value),
                light_hours: parseFloat(document.getElementById('light_hours').value),
                water_given_ml: parseFloat(document.getElementById('water_given_ml').value),
                nutrient_level: parseFloat(document.getElementById('nutrient_level').value),
                days_grown: days
            };

            fetch('/schedule-recommend', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
            .then(function(res) { return res.json(); })
            .then(function(result) {
                var section = document.getElementById('resultSection');
                var list = document.getElementById('scheduleList');
                section.style.display = 'block';
                list.innerHTML = '';

                var crops = result.recommendations;
                for (var i = 0; i < crops.length; i++) {
                    var c = crops[i];
                    var progress = c.days_grown > 0 ? Math.min(100, Math.round((c.days_grown / c.max_days) * 100)) : 0;

                    var alertHtml = '';
                    if (c.days_grown === 0) {
                        alertHtml = '<div class="alert alert-good">🌱 Ready to plant! Optimal conditions detected.</div>';
                    } else if (c.days_grown >= c.min_days) {
                        alertHtml = '<div class="alert alert-good">✅ Crop is ready to harvest!</div>';
                    } else {
                        var remaining = c.min_days - c.days_grown;
                        alertHtml = '<div class="alert alert-warn">⏳ ' + remaining + ' more days until minimum harvest time.</div>';
                    }

                    list.innerHTML += '<div class="crop-card">' +
                        '<div class="crop-header">' +
                            '<div class="crop-name">' + (i+1) + '. ' + c.crop + '</div>' +
                            '<div class="match-badge">' + c.match_score + '% match</div>' +
                        '</div>' +
                        '<div class="progress-section">' +'<div class="progress-label"><span>Growth Progress</span><span>' + progress + '%</span></div>' +
                            '<div class="progress-bar"><div class="progress-fill" style="width:' + progress + '%"></div></div>' +
                        '</div>' +
                        '<div class="details-grid">' +
                            '<div class="detail-box"><div class="val">' + c.min_days + '-' + c.max_days + '</div><div class="lbl">Growth Days</div></div>' +
                            '<div class="detail-box"><div class="val">' + c.sowing_depth + '</div><div class="lbl">Sowing Depth</div></div>' +
                            '<div class="detail-box"><div class="val">' + c.water_schedule + '</div><div class="lbl">Water Schedule</div></div>' +
                        '</div>' +
                        alertHtml +
                    '</div>';
                }
            });
        }
    </script>
</body>
</html>
