<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Desert AgriTech - AI Cultivation Engine</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
        body { background:linear-gradient(135deg,#d97706,#92400e); min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px; }
        .navbar { max-width:1100px; width:100%; margin-bottom:15px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
        .nav-link { padding:8px 12px; background:rgba(255,255,255,0.9); color:#92400e; text-decoration:none; border-radius:8px; font-weight:600; font-size:12px; transition:0.3s; white-space:nowrap; }
        .nav-link:hover, .nav-link.active { background:#92400e; color:white; }
        .container { background:#fff; border-radius:16px; padding:35px; max-width:1100px; width:100%; box-shadow:0 10px 40px rgba(0,0,0,0.2); margin-bottom:20px; }
        h1 { color:#92400e; text-align:center; margin-bottom:5px; }
        .subtitle { text-align:center; color:#666; margin-bottom:25px; font-weight: 500;}
        
        .search-box { display:flex; gap:10px; margin-bottom:25px; }
        .search-box input { flex:1; padding:12px 15px; border:2px solid #e5e7eb; border-radius:8px; font-size:14px; outline:none; }
        .search-box input:focus { border-color:#d97706; }
        
        .filter-btns { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:25px; justify-content: center;}
        .filter-btn { padding:10px 20px; border:2px solid #d97706; border-radius:20px; background:white; color:#92400e; font-size:14px; font-weight:bold; cursor:pointer; transition:0.3s; }
        .filter-btn.active, .filter-btn:hover { background:#d97706; color:white; }
        
        .crops-grid { display:grid; grid-template-columns:1fr 1fr; gap:25px; }
        .crop-card { border:2px solid #fef3c7; border-radius:12px; overflow:hidden; background: #fff;}
        .crop-header { background:linear-gradient(135deg,#92400e,#d97706); padding:18px 20px; color:white; display:flex; justify-content:space-between; align-items:center; cursor:pointer; transition: 0.2s;}
        .crop-header:hover { opacity: 0.9;}
        .crop-header h3 { font-size:16px; display: flex; align-items: center; gap: 8px;}
        .crop-header .days-badge { background:rgba(255,255,255,0.25); padding:6px 12px; border-radius:20px; font-size:12px; font-weight: bold; border: 1px solid rgba(255,255,255,0.4);}
        
        .crop-body { padding:25px; display:none; background: #fafafa;}
        .crop-body.open { display:block; }
        
        .milestones { margin-bottom:20px; }
        .milestone-label { font-size:14px; color:#444; margin-bottom:8px; font-weight:bold; }
        .milestone-bar { display:flex; gap:4px; margin-bottom:12px; }
        .milestone-bar .phase { flex:1; height:28px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:11px; color:white; font-weight:bold; text-shadow: 0 1px 2px rgba(0,0,0,0.3); text-align: center; padding: 2px;}
        .phase.germination { background:#10b981; }
        .phase.vegetative { background:#3b82f6; }
        .phase.flowering { background:#f59e0b; }
        .phase.harvest { background:#ef4444; }
        
        .details-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
        .detail-item { background:#fff; border-radius:8px; padding:12px; border: 1px solid #e5e7eb;}
        .detail-item .label { font-size:12px; color:#6b7280; margin-bottom:4px; font-weight: 600;}
        .detail-item .value { font-size:15px; font-weight:bold; color:#92400e; }
        
        .tips { background:#f0fdf4; border-radius:8px; padding:18px; border-left:5px solid #10b981; }
        .tips h4 { color:#065f46; font-size:15px; margin-bottom:10px; }
        .tips ul { list-style:none; padding:0; margin-left: 15px;}
        .tips ul li { font-size:13px; color:#374151; padding:3px 0; line-height: 1.5;}
    </style>
</head>
<body>

            {'name':'Finger Millet (Ragi)', 'region':'India', 'temp_min':20, 'temp_max':35, 'humidity_min':40, 'humidity_max':75, 'ph_min':5.0, 'ph_max':8.0, 'soil_moisture_min':35, 'soil_moisture_max':60, 'light_min':80, 'light_max':100, 'rain_min':500, 'rain_max':1000, 'grow_days':120, 'water_need':'Low', 'priority':9},
            {'name':'Barley', 'region':'World', 'temp_min':12, 'temp_max':25, 'humidity_min':40, 'humidity_max':70, 'ph_min':6.0, 'ph_max':7.5, 'soil_moisture_min':35, 'soil_moisture_max':60, 'light_min':80, 'light_max':100, 'rain_min':200, 'rain_max':1000, 'grow_days':100, 'water_need':'Low', 'priority':9},
            {'name':'Oats', 'region':'World', 'temp_min':15, 'temp_max':25, 'humidity_min':50, 'humidity_max':80, 'ph_min':5.5, 'ph_max':7.0, 'soil_moisture_min':45, 'soil_moisture_max':70, 'light_min':75, 'light_max':100, 'rain_min':400, 'rain_max':800, 'grow_days':100, 'water_need':'Medium', 'priority':8},
            {'name':'Tomato', 'region':'World', 'temp_min':20, 'temp_max':30, 'humidity_min':50, 'humidity_max':80, 'ph_min':6.0, 'ph_max':6.8, 'soil_moisture_min':50, 'soil_moisture_max':70, 'light_min':70, 'light_max':100, 'rain_min':600, 'rain_max':1200, 'grow_days':90, 'water_need':'Medium', 'priority':10},
            {'name':'Chili Pepper', 'region':'India', 'temp_min':20, 'temp_max':35, 'humidity_min':50, 'humidity_max':80, 'ph_min':6.0, 'ph_max':7.0, 'soil_moisture_min':45, 'soil_moisture_max':70, 'light_min':75, 'light_max':100, 'rain_min':600, 'rain_max':1200, 'grow_days':90, 'water_need':'Medium', 'priority':10},
            {'name':'Aloe Vera', 'region':'Saudi/India', 'temp_min':20, 'temp_max':40, 'humidity_min':20, 'humidity_max':60, 'ph_min':7.0, 'ph_max':8.5, 'soil_moisture_min':15, 'soil_moisture_max':40, 'light_min':80, 'light_max':100, 'rain_min':150, 'rain_max':400, 'grow_days':730, 'water_need':'Low', 'priority':10}

        ];

        const dry_fruits_data = [
            {'name':'Almond (Badam)', 'region':'World', 'temp_min':15, 'temp_max':30, 'humidity_min':30, 'humidity_max':60, 'ph_min':6.0, 'ph_max':7.5, 'soil_moisture_min':35, 'soil_moisture_max':60, 'light_min':80, 'light_max':100, 'rain_min':400, 'rain_max':700, 'grow_days':1095, 'water_need':'Medium', 'priority':10},
            {'name':'Walnut (Akhrot)', 'region':'India', 'temp_min':10, 'temp_max':25, 'humidity_min':40, 'humidity_max':70, 'ph_min':6.0, 'ph_max':7.0, 'soil_moisture_min':40, 'soil_moisture_max':65, 'light_min':75, 'light_max':100, 'rain_min':600, 'rain_max':1000, 'grow_days':1825, 'water_need':'Medium', 'priority':10},
            {'name':'Cashew (Kaju)', 'region':'India', 'temp_min':20, 'temp_max':35, 'humidity_min':60, 'humidity_max':85, 'ph_min':5.5, 'ph_max':6.5, 'soil_moisture_min':50, 'soil_moisture_max':75, 'light_min':80, 'light_max':100, 'rain_min':1000, 'rain_max':2000, 'grow_days':1095, 'water_need':'Medium', 'priority':10},
            {'name':'Pistachio (Pista)', 'region':'World', 'temp_min':15, 'temp_max':38, 'humidity_min':20, 'humidity_max':50, 'ph_min':7.0, 'ph_max':8.5, 'soil_moisture_min':25, 'soil_moisture_max':50, 'light_min':85, 'light_max':100, 'rain_min':200, 'rain_max':500, 'grow_days':1825, 'water_need':'Low', 'priority':10},

            {'name':'Fox Nut (Makhana)', 'region':'India', 'temp_min':20, 'temp_max':35, 'humidity_min':70, 'humidity_max':90, 'ph_min':6.5, 'ph_max':7.5, 'soil_moisture_min':90, 'soil_moisture_max':100, 'light_min':80, 'light_max':100, 'rain_min':1000, 'rain_max':2000, 'grow_days':150, 'water_need':'High', 'priority':10},
            {'name':'Ajwa Date', 'region':'Saudi', 'temp_min':25, 'temp_max':50, 'humidity_min':10, 'humidity_max':40, 'ph_min':7.0, 'ph_max':8.5, 'soil_moisture_min':15, 'soil_moisture_max':35, 'light_min':90, 'light_max':100, 'rain_min':0, 'rain_max':150, 'grow_days':1460, 'water_need':'Low', 'priority':10},
            {'name':'Sunflower Seed', 'region':'World', 'temp_min':20, 'temp_max':32, 'humidity_min':40, 'humidity_max':70, 'ph_min':6.0, 'ph_max':7.5, 'soil_moisture_min':40, 'soil_moisture_max':65, 'light_min':85, 'light_max':100, 'rain_min':500, 'rain_max':900, 'grow_days':100, 'water_need':'Medium', 'priority':9},
            {'name':'Chia Seed', 'region':'World', 'temp_min':15, 'temp_max':28, 'humidity_min':40, 'humidity_max':70, 'ph_min':6.5, 'ph_max':8.0, 'soil_moisture_min':40, 'soil_moisture_max':65, 'light_min':80, 'light_max':100, 'rain_min':400, 'rain_max':800, 'grow_days':120, 'water_need':'Low', 'priority':8}
            // Add the rest of your 50 Dry Fruits here directly!
        ];

        // ==========================================
        // DYNAMIC RENDER ENGINE (Formats the raw arrays into UI)
        // ==========================================
        
        let allCropsCompiled = [];
        
        function compileDatabase() {
            // Process Trees
            trees_data.forEach(c => {
                allCropsCompiled.push({
                    category: "Tree", icon: "🌳", name: c.name, days: c.grow_days + " days",
                    phases: ["Sapling / Rooting", "Vegetative Canopy", "Flowering", "Harvest Cycle"],
                    depth: "5-10 cm", water: "Every " + (c.water_need==='Low'?14:(c.water_need==='Medium'?7:3)) + " days",
                    ph: c.ph_min + " - " + c.ph_max, heat: "Up to " + c.temp_max + "°C",
                    tips: ["Optimal Native Region: " + c.region, "Required Light Intensity: " + c.light_min + "% - " + c.light_max + "%", "System Priority Index: " + c.priority + "/10"]
                });
            });
            // Process Plants
            plants_data.forEach(c => {
                allCropsCompiled.push({
                    category: "Plant", icon: "🌿", name: c.name, days: c.grow_days + " days",
                    phases: ["Germination", "Vegetative Growth", "Flowering Phase", "Maturation"],
                    depth: "1-3 cm", water: "Every " + (c.water_need==='Low'?7:(c.water_need==='Medium'?4:2)) + " days",
                    ph: c.ph_min + " - " + c.ph_max, heat: "Up to " + c.temp_max + "°C",
                    tips: ["Optimal Native Region: " + c.region, "Required Light Intensity: " + c.light_min + "% - " + c.light_max + "%", "System Priority Index: " + c.priority + "/10"]
                });
            });
            // Process Dry Fruits
            dry_fruits_data.forEach(c => {
                allCropsCompiled.push({
                    category: "Dry Fruit", icon: "🥜", name: c.name, days: c.grow_days + " days",
                    phases: ["Seedling", "Structural Est.", "Nut Development", "Yield Harvest"],
                    depth: "3-5 cm", water: "Every " + (c.water_need==='Low'?10:(c.water_need==='Medium'?7:4)) + " days",
                    ph: c.ph_min + " - " + c.ph_max, heat: "Up to " + c.temp_max + "°C",
                    tips: ["Optimal Native Region: " + c.region, "Required Light Intensity: " + c.light_min + "% - " + c.light_max + "%", "System Priority Index: " + c.priority + "/10"]
                });
            });
        }

        function renderCrops(filterCategory, searchQuery) {
            const grid = document.getElementById('cropsGrid');
            grid.innerHTML = ''; 

            allCropsCompiled.forEach((crop, index) => {
                if (filterCategory !== 'All' && crop.category !== filterCategory) return;
                if (searchQuery && !crop.name.toLowerCase().includes(searchQuery.toLowerCase())) return;

                let tipsHtml = '';
                crop.tips.forEach(tip => { tipsHtml += `<li>${tip}</li>`; });

                const cardHtml = `
                    <div class="crop-card">
                        <div class="crop-header" onclick="toggleCrop(this)">
                            <h3>${crop.icon} ${crop.name}</h3><span class="days-badge">${crop.days}</span>
                        </div>
                        <div class="crop-body">
                            <div class="milestones">
                                <div class="milestone-label">Growth Timeline Matrix</div>
                                <div class="milestone-bar">
                                    <div class="phase germination">${crop.phases[0]}</div>
                                    <div class="phase vegetative">${crop.phases[1]}</div>
                                    <div class="phase flowering">${crop.phases[2]}</div>
                                    <div class="phase harvest">${crop.phases[3]}</div>
                                </div>
                            </div>
                            <div class="details-grid">
                                <div class="detail-item"><div class="label">Optimal Sowing Depth</div><div class="value">${crop.depth}</div></div>
                                <div class="detail-item"><div class="label">Hydration Cycle</div><div class="value">${crop.water}</div></div>
                                <div class="detail-item"><div class="label">Optimal pH Level</div><div class="value">${crop.ph}</div></div>
                                <div class="detail-item"><div class="label">Thermal Tolerance</div><div class="value">${crop.heat}</div></div>
                            </div>
                            <div class="tips">
                                <h4>Expert Cultivation Parameters</h4>
                                <ul>${tipsHtml}</ul>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHtml;
            });
        }

        window.onload = () => { 
            compileDatabase();
            renderCrops('All', ''); 
        };

        function toggleCrop(header) {
            var body = header.nextElementSibling;
            body.classList.toggle('open');
        }

        function filterCrops() {
            var search = document.getElementById('searchInput').value;
            var activeBtn = document.querySelector('.filter-btn.active').innerText;
            var cat = 'All';
            if(activeBtn.includes('Trees')) cat = 'Tree';
            if(activeBtn.includes('Plants')) cat = 'Plant';
            if(activeBtn.includes('Dry Fruits')) cat = 'Dry Fruit';
            renderCrops(cat, search);
        }

        function filterByCategory(cat, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            var search = document.getElementById('searchInput').value;
            renderCrops(cat, search);
        }
    </script>
</body>
</html>
