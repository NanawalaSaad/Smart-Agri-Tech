<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Desert AgriTech by Saad</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #d35400, #e67e22); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; text-align: center; }
        h1 { font-size: 40px; text-shadow: 2px 2px 5px rgba(0,0,0,0.4); margin-bottom: 10px; }
        p.subtitle { font-size: 20px; font-weight: bold; margin-bottom: 50px; color: #f1c40f; text-shadow: 1px 1px 3px rgba(0,0,0,0.3); }
        .container { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 800px; }
        .box { flex: 1; min-width: 250px; padding: 40px 20px; border-radius: 20px; text-decoration: none; color: white; font-size: 24px; font-weight: bold; box-shadow: 0 10px 20px rgba(0,0,0,0.2); transition: 0.3s; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .box:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.3); }
        .box-sensor { background: linear-gradient(135deg, #2980b9, #3498db); border: 2px solid #74b9ff; }
        .box-predict { background: linear-gradient(135deg, #27ae60, #2ecc71); border: 2px solid #55efc4; }
        .icon { font-size: 50px; }
    </style>
</head>
<body>

    <h1>🌾 Smart Desert AgriTech</h1>
    <p class="subtitle">By Saad</p>

    <div class="container">
        <!-- 1. Sensor Data Box -->
        <a href="/sensors" class="box box-sensor">
            <span class="icon">📡</span>
            Live Sensor Data
        </a>

        <!-- 2. Prediction & Dashboard Box -->
        <a href="/predict-options" class="box box-predict">
            <span class="icon">🧠</span>
            AI Predictor & Hub
        </a>
    </div>

</body>
</html>
