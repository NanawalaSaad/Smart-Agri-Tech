<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Desert AgriTech - AI Yield Predictor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #d97706, #92400e); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: #fff; border-radius: 16px; padding: 40px; max-width: 900px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        h1 { color: #92400e; text-align: center; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-weight: 500; }
        .navbar { max-width: 900px; margin: 0 auto 15px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .nav-link { padding: 8px 12px; background: rgba(255,255,255,0.9); color: #92400e; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 12px; transition: 0.3s; white-space: nowrap; }
        .nav-link:hover, .nav-link.active { background: #92400e; color: white; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .field label { display: flex; justify-content: space-between; font-weight: 600; color: #444; margin-bottom: 5px; }
        .field input[type="range"] { width: 100%; accent-color: #d97706; }
        .value { color: #d97706; font-weight: bold; }
        button { display: block; width: 100%; margin-top: 30px; padding: 15px; background: #d97706; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #92400e; }
        .result { margin-top: 25px; padding: 20px; border-radius: 8px; text-align: center; font-size: 20px; font-weight: bold; display: none; }
        .result.healthy { background: #d1fae5; color: #065f46; }
        .result.stress { background: #fee2e2; color: #991b1b; }
        .status-badge { background: #fef3c7; color: #92400e; padding: 8px 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; font-weight: bold; border-left: 4px solid #d97706; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/" class="nav-link active">🏠 Predictor</a>
        <a href="/predict-options" class="nav-link">🎯 Smart Predict</a>
        <a href="/crop" class="nav-link">🌱 Crop Recommend</a>
        <a href="/insights" class="nav-link">📊 Insights</a>
        <a href="/schedule" class="nav-link">📅 Schedule</a>
        <a href="/hardware" class="nav-link">🔧 Hardware</a>
        <a href="/protection" class="nav-link">🛡️ Desert Shield</a>
        <a href="/playbook" class="nav-link">📖 AI Playbook</a>
        <a href="/contact" class="nav-link">🌿 Join the Oasis</a>
        <a href="/about" class="nav-link">ℹ️ About</a>
    </div>
    <div class="container">
        <h1>🌾 Desert AgriTech</h1>
        <p class="subtitle">Hardware-Driven AI Yield Predictor</p>
        
        <div class="status-badge" id="syncStatus">📡 Syncing with ESP32 Hardware...</div>

        <div class="grid">
            <div class="field">
                <label>Temperature (°C) <span class="value" id="val_temperature">0</span></label>
                <input type="range" id="temperature" min="0" max="60" step="0.1" value="0">
            </div>
            <div class="field">
                <label>Humidity (%) <span class="value" id="val_humidity">0</span></label>
                <input type="range" id="humidity" min="0" max="100" step="0.1" value="0">
            </div>
            <div class="field">
                <label>Soil Moisture (%) <span class="value" id="val_soil_moisture">0</span></label>
                <input type="range" id="soil_moisture" min="0" max="100" step="0.1" value="0">
            </div>
            <div class="field">
                <label>pH Level <span class="value" id="val_pH_level">0</span></label>
                <input type="range" id="pH_level" min="0" max="14" step="0.1" value="0">
            </div>
            <div class="field" style="grid-column: span 2;">
                <label>Light Exposure (Hours based on LDR) <span class="value" id="val_light_hours">0</span></label>
                <input type="range" id="light_hours" min="0" max="24" step="0.1" value="0">
            </div>
        </div>

        <button onclick="predictYield()">🔍 Predict Yield Based on Live Telemetry</button>
        <div class="result" id="resultBox"></div>
    </div>

    <script>
        var sliders = document.querySelectorAll('input[type="range"]');
        for (var i = 0; i < sliders.length; i++) {
            sliders[i].style.pointerEvents = 'none'; 
            sliders[i].style.opacity = '0.7';
        }

        setInterval(function() {
            fetch('/api/live-sensor')
            .then(res => res.json())
            .then(data => {
                document.getElementById('temperature').value = data.temperature || 0;
                document.getElementById('val_temperature').textContent = data.temperature || 0;
                document.getElementById('humidity').value = data.humidity || 0;
                document.getElementById('val_humidity').textContent = data.humidity || 0;
                document.getElementById('soil_moisture').value = data.soil_moisture || 0;
                document.getElementById('val_soil_moisture').textContent = data.soil_moisture || 0;
                
                // Keep pH to 1 decimal place for cleaner UI
                let phFormat = data.pH_level ? parseFloat(data.pH_level).toFixed(1) : 0;
                document.getElementById('pH_level').value = phFormat;
                document.getElementById('val_pH_level').textContent = phFormat;
                
                if(data.light_hours) {
                    let lightFormat = parseFloat(data.light_hours).toFixed(1);
                    document.getElementById('light_hours').value = lightFormat;
                    document.getElementById('val_light_hours').textContent = lightFormat;
                }
                
                if(data.temperature > 0) {
                    document.getElementById('syncStatus').innerHTML = "✅ Hardware Connected & Syncing Live Data";
                    document.getElementById('syncStatus').style.background = "#d1fae5";
                    document.getElementById('syncStatus').style.color = "#065f46";
                }
            }).catch(e => console.log("Waiting for hardware..."));
        }, 2000);

        function predictYield() {
            fetch('/predict', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({}) })
            .then(res => res.json())
            .then(result => {
                var box = document.getElementById('resultBox');
                box.style.display = 'block';
                
                if (result.yield_kg === 0 || result.status.includes('ERROR')) {
                    box.className = 'result stress';
                    box.innerHTML = '🚨 ' + result.status;
                } else if (result.status === 'Healthy') {
                    box.className = 'result healthy';
                    box.innerHTML = 'Predicted Yield: ' + result.yield_kg + ' kg <br> Plant Healthy';
                } else {
                    box.className = 'result stress';
                    box.innerHTML = 'Predicted Yield: ' + result.yield_kg + ' kg <br> Water Stress Risk';
                }
            });
        }
    </script>
</body>
</html>
